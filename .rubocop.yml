AllCops:
  NewCops: enable
  TargetRubyVersion: 2.6
  SuggestExtensions: false
  Exclude:
    - "sshd-config/**/*"

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120

Style/SpecialGlobalVars:
  Enabled: false

Metrics/BlockLength:
  Max: 200
  Exclude:
    - "spec/**/*"

Lint/ConstantDefinitionInBlock:
  Exclude:
    - "spec/spec_helper.rb"

Metrics/AbcSize:
  Max: 25

Metrics/MethodLength:
  Max: 30
