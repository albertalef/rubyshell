name: Build + Release

on:
  push:
    tags:
      - "v*"

  pull_request:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/tamatebako/tebako-ubuntu-20.04:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        shell: sh
        run: |
          set -eu
          mkdir -p dist

          tebako press --root='.' --entry-point='rubyshell' --output='./dist/rubyshell'

          ls -lah dist

      - name: Checksums
        shell: sh
        run: |
          set -eu
          (cd dist && sha256sum * > SHA256SUMS.txt) || true
          ls -lah dist

      - name: Upload dist as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
